[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purevegi-backend"
version = "0.1.0"
description = "Pure Vegi ordering platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "cryptography>=42",
    "stripe>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.15.11"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 132
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I", "RUF"]
allowed-confusables = ["–", "×"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as default arguments.
extend-immutable-calls = ["app.deps.require", "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

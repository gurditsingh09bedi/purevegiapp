<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="A little Sikh boy in an orange patka happily eating a slice of Pure Vegi pizza">
  <style>
    /* One loop = 3.2s: lift slice, bite, chew with happy eyes, lower, repeat. */
    * { animation-duration: 3.2s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .arm { transform-box: view-box; transform-origin: 206px 262px; animation-name: lift; transform: rotate(45deg); }
    @keyframes lift { 0%, 8% { transform: rotate(45deg); } 32%, 48% { transform: rotate(0deg); } 66%, 100% { transform: rotate(45deg); } }
    .whole { animation-name: showWhole; }
    .bitten { animation-name: showBitten; }
    @keyframes showWhole { 0%, 40% { opacity: 1; } 41%, 99% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes showBitten { 0%, 40% { opacity: 0; } 41%, 99% { opacity: 1; } 100% { opacity: 0; } }
    .cheese { transform-box: fill-box; transform-origin: 100% 50%; animation-name: stretch; }
    @keyframes stretch { 0%, 40% { transform: scaleX(0); opacity: 0; } 44% { transform: scaleX(1); opacity: 1; } 56% { transform: scaleX(1.6); opacity: 1; } 60%, 100% { transform: scaleX(0); opacity: 0; } }
    .head { transform-box: view-box; transform-origin: 150px 250px; animation-name: bob; }
    @keyframes bob { 0%, 30% { transform: rotate(0) translateY(0); } 40% { transform: rotate(3deg) translateY(2px); }
      50%, 70% { transform: rotate(-2deg) translateY(0); } 55%, 65% { transform: rotate(2deg) translateY(1px); } 85%, 100% { transform: rotate(0) translateY(0); } }
    .smile { animation-name: smileA; } .open { animation-name: openA; } .chew { transform-box: fill-box; transform-origin: center; animation-name: chewA; }
    @keyframes smileA { 0%, 30% { opacity: 1; } 31%, 79% { opacity: 0; } 80%, 100% { opacity: 1; } }
    @keyframes openA { 0%, 30% { opacity: 0; } 31%, 41% { opacity: 1; } 42%, 100% { opacity: 0; } }
    @keyframes chewA { 0%, 41% { opacity: 0; } 42% { opacity: 1; transform: scaleY(1); } 47% { transform: scaleY(.4); } 52% { transform: scaleY(1); }
      57% { transform: scaleY(.4); } 62% { transform: scaleY(1); } 67% { transform: scaleY(.4); } 72%, 79% { opacity: 1; transform: scaleY(1); } 80%, 100% { opacity: 0; } }
    .eyes { transform-box: fill-box; transform-origin: center; animation-name: blinkA; } .happy { animation-name: happyA; }
    @keyframes blinkA { 0%, 14% { opacity: 1; transform: scaleY(1); } 16% { transform: scaleY(.1); } 18%, 44% { opacity: 1; transform: scaleY(1); } 45%, 79% { opacity: 0; } 80%, 100% { opacity: 1; } }
    @keyframes happyA { 0%, 44% { opacity: 0; } 45%, 79% { opacity: 1; } 80%, 100% { opacity: 0; } }
    .cheeks { transform-box: fill-box; transform-origin: center; animation-name: puff; }
    @keyframes puff { 0%, 42% { transform: scale(1); } 50%, 70% { transform: scale(1.25); } 80%, 100% { transform: scale(1); } }
    .yum { animation-name: yumA; }
    @keyframes yumA { 0%, 50% { opacity: 0; transform: translateY(6px); } 58%, 78% { opacity: 1; transform: translateY(0); } 88%, 100% { opacity: 0; transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .bitten, .open, .chew, .happy, .yum, .cheese { opacity: 0; } }
  </style>

  <!-- floor shadow -->
  <ellipse cx="150" cy="292" rx="96" ry="8" fill="#000" opacity=".12"/>

  <!-- body: Pure Vegi green t-shirt -->
  <path d="M78 300 C78 250 104 228 150 228 C196 228 222 250 222 300 Z" fill="#0b5a48"/>
  <path d="M132 229 Q150 246 168 229" fill="none" stroke="#07412f" stroke-width="4" stroke-linecap="round"/>
  <!-- little heart logo on shirt -->
  <path d="M110 268 c-6 -8 4 -14 8 -6 c4 -8 14 -2 8 6 l-8 8 z" fill="#f6f1e4" opacity=".9"/>
  <!-- left arm resting -->
  <path d="M92 262 Q76 286 96 296" fill="none" stroke="#0b5a48" stroke-width="20" stroke-linecap="round"/>
  <circle cx="98" cy="294" r="10" fill="#c98b5d"/>

  <!-- head -->
  <g class="head">
    <rect x="138" y="206" width="24" height="26" rx="10" fill="#b97a4f"/>
    <!-- ears -->
    <ellipse cx="88" cy="164" rx="11" ry="14" fill="#c98b5d"/>
    <ellipse cx="212" cy="164" rx="11" ry="14" fill="#c98b5d"/>
    <!-- face -->
    <ellipse cx="150" cy="160" rx="62" ry="58" fill="#d49668"/>
    <!-- patka (kesri), with the knot on top -->
    <circle cx="150" cy="80" r="24" fill="#e8871e"/>
    <path d="M136 74 Q150 64 164 74 M134 86 Q150 76 166 86" fill="none" stroke="#c96f12" stroke-width="3" stroke-linecap="round"/>
    <path d="M86 156 C80 96 118 84 150 84 C182 84 220 96 214 156 C204 134 184 124 150 124 C116 124 96 134 86 156 Z" fill="#f09630"/>
    <path d="M98 128 Q150 104 202 128 M92 144 Q150 118 208 144" fill="none" stroke="#c96f12" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
    <!-- eyebrows -->
    <path d="M114 140 q12 -7 24 0 M162 140 q12 -7 24 0" fill="none" stroke="#3b2414" stroke-width="4" stroke-linecap="round"/>
    <!-- eyes open -->
    <g class="eyes">
      <ellipse cx="126" cy="160" rx="8" ry="10" fill="#241509"/>
      <ellipse cx="174" cy="160" rx="8" ry="10" fill="#241509"/>
      <circle cx="129" cy="156" r="3" fill="#fff"/>
      <circle cx="177" cy="156" r="3" fill="#fff"/>
    </g>
    <!-- happy eyes (^ ^) while chewing -->
    <path class="happy" d="M116 162 q10 -12 20 0 M164 162 q10 -12 20 0" fill="none" stroke="#241509" stroke-width="4.5" stroke-linecap="round" opacity="0"/>
    <!-- cheeks -->
    <g class="cheeks"><circle cx="110" cy="184" r="11" fill="#f08a7e" opacity=".55"/><circle cx="190" cy="184" r="11" fill="#f08a7e" opacity=".55"/></g>
    <!-- nose -->
    <path d="M146 176 q4 5 8 0" fill="none" stroke="#9c6038" stroke-width="3" stroke-linecap="round"/>
    <!-- mouth states -->
    <path class="smile" d="M134 192 Q150 208 166 192" fill="#7a2b1f" stroke="#5b1d13" stroke-width="3" stroke-linecap="round"/>
    <ellipse class="open" cx="152" cy="198" rx="12" ry="11" fill="#5b1d13" opacity="0"/>
    <ellipse class="chew" cx="152" cy="197" rx="10" ry="5" fill="#5b1d13" opacity="0"/>
  </g>

  <!-- right arm with kara, holding a slice of pizza (drawn in the bite pose; rests rotated 45deg) -->
  <g class="arm">
    <path d="M206 262 Q226 240 226 210" fill="none" stroke="#0b5a48" stroke-width="20" stroke-linecap="round"/>
    <g class="whole">
      <path d="M158 197 L224 166 L234 210 Z" fill="#ffd45a"/>
      <path d="M224 166 Q242 186 234 210" fill="none" stroke="#d98a2b" stroke-width="9" stroke-linecap="round"/>
      <circle cx="198" cy="190" r="5" fill="#e2442c"/><circle cx="214" cy="198" r="4.5" fill="#e2442c"/>
      <path d="M180 192 l8 -3 M206 180 l7 -2" stroke="#3f8f2a" stroke-width="4" stroke-linecap="round"/>
      <circle cx="190" cy="199" r="2.6" fill="#2b2b2b"/>
    </g>
    <g class="bitten" opacity="0">
      <path d="M180 186.7 q-6 3 0 6.8 q-6 3 0 7.4 L234 210 L224 166 Z" fill="#ffd45a"/>
      <path d="M224 166 Q242 186 234 210" fill="none" stroke="#d98a2b" stroke-width="9" stroke-linecap="round"/>
      <circle cx="198" cy="190" r="5" fill="#e2442c"/><circle cx="214" cy="198" r="4.5" fill="#e2442c"/>
      <path d="M206 180 l7 -2" stroke="#3f8f2a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path class="cheese" d="M178 195 q-10 3 -20 2" fill="none" stroke="#ffd45a" stroke-width="3.5" stroke-linecap="round" opacity="0"/>
    <ellipse cx="225" cy="216" rx="12" ry="5" fill="none" stroke="#c9ccd2" stroke-width="4"/>
    <circle cx="228" cy="203" r="12" fill="#c98b5d"/>
  </g>

  <!-- "yum!" bubble -->
  <g class="yum" opacity="0">
    <rect x="30" y="92" width="56" height="30" rx="15" fill="#fff"/>
    <path d="M78 118 l10 10 l-2 -12 z" fill="#fff"/>
    <text x="58" y="113" text-anchor="middle" font-family="Rubik, Arial, sans-serif" font-weight="800" font-size="15" fill="#023e32">yum!</text>
  </g>
</svg>

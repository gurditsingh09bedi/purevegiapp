<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#023E32" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta property="og:title" content="Pure Vegi · Thinking vegi? Think Pure Vegi." />
    <meta property="og:description" content="Vegetarian pizza, burgers, wraps, noodles and stir fry on Soho Road, Handsworth. Delivery Friday to Sunday, collection and table ordering." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:type" content="website" />
    <link rel="preload" as="image" href="/media/hero.jpg" />
    <title>Pure Vegi · Order online · Handsworth, Birmingham</title>
    <meta name="description" content="Order vegetarian and vegan burgers, wraps, noodles and stir fry from Pure Vegi, 324 Soho Rd, Handsworth. Delivery Friday to Sunday, 5pm to 10pm, collection and table ordering." />
    <link rel="icon" href="/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Shown while the site loads (refresh, first visit); the app fades it out once the menu is ready. -->
    <div id="boot-loader" class="pv-loader-screen" role="status" aria-live="polite">
      <div class="pv-spinner">
        <img src="/boy-photo.png" alt="" onerror="this.onerror=null;this.src='/loading-boy.svg'" />
      </div>
      <p>Getting something tasty ready…</p>
    </div>
    <style>
      .pv-loader-screen { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #f6f1e4; font: 700 16px "Nunito Sans", system-ui, sans-serif; color: #3f5147; transition: opacity .45s; }
      .pv-loader-screen.gone { opacity: 0; pointer-events: none; }
      .pv-spinner { position: relative; width: 132px; height: 132px; border-radius: 50%; }
      .pv-spinner::before { content: ""; position: absolute; inset: -7px; border-radius: 50%;
        background: conic-gradient(from 0deg, #f2a65a 0 28%, rgba(2, 62, 50, .12) 28% 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
        animation: pv-spin 1s linear infinite; }
      .pv-spinner img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fffdf7; box-shadow: 0 8px 24px rgba(2, 62, 50, .18); }
      @keyframes pv-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .pv-spinner::before { animation-duration: 3s; } }
    </style>
    <!-- Opened as an app (Pure Vegi phone app, or added to the home screen): a branded splash instead -->
    <div id="pv-splash-tpl" hidden>
      <div class="pv-splash-heart"><img src="/logo-heart.png" alt="" /><i></i><i></i></div>
      <p class="pv-splash-word">Thinking vegi? <b>Think Pure Vegi.</b></p>
    </div>
    <script>
      (function () {
        var app = /PureVegiApp/.test(navigator.userAgent) || (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
        var boot = document.getElementById("boot-loader");
        if (!app || !boot) return;
        boot.classList.add("pv-splash");
        boot.innerHTML = document.getElementById("pv-splash-tpl").innerHTML;
        boot.dataset.until = String(Date.now() + 1500); // let the animation play
      })();
    </script>
    <style>
      .pv-splash { background: radial-gradient(circle at 50% 45%, #0b5a48, #023e32 60%, #01261f); color: #f6f1e4; }
      .pv-splash-heart { position: relative; width: 190px; height: 190px; display: grid; place-items: center; }
      .pv-splash-heart img { width: 100%; height: auto; animation: pv-pop .9s cubic-bezier(.3, 1.5, .5, 1) both; filter: drop-shadow(0 10px 30px rgba(0, 0, 0, .35)); }
      .pv-splash-heart i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(242, 166, 90, .7); animation: pv-ring 1.6s .3s ease-out infinite; }
      .pv-splash-heart i + i { animation-delay: .9s; }
      .pv-splash-word { margin-top: 26px; font: 700 17px "Nunito Sans", system-ui, sans-serif; color: #cfe0d6; animation: pv-rise .7s .45s both; }
      .pv-splash-word b { color: #f2a65a; }
      @keyframes pv-pop { from { opacity: 0; transform: scale(.4) rotate(-8deg); } }
      @keyframes pv-ring { from { transform: scale(.8); opacity: .9; } to { transform: scale(1.8); opacity: 0; } }
      @keyframes pv-rise { from { opacity: 0; transform: translateY(12px); } }
      @media (prefers-reduced-motion: reduce) { .pv-splash-heart img, .pv-splash-heart i, .pv-splash-word { animation: none; } }
    </style>
    <script>
      // Safety net: if the site hasn't appeared after 12 seconds (server asleep, or a script error),
      // say so and offer a retry instead of spinning forever. Any script error is shown too.
      (function () {
        var errs = [];
        window.addEventListener("error", function (e) { errs.push(e.message || String(e)); });
        window.addEventListener("unhandledrejection", function (e) { errs.push(String((e.reason && e.reason.message) || e.reason)); });
        setTimeout(function () {
          var boot = document.getElementById("boot-loader");
          if (!boot || boot.classList.contains("gone")) return;
          var p = boot.querySelector("p") || boot.appendChild(document.createElement("p"));
          p.innerHTML = "This is taking longer than usual. <button onclick=\"location.reload()\" style=\"margin-left:8px;padding:8px 14px;border-radius:999px;border:0;background:#023e32;color:#fff;font:inherit;cursor:pointer\">Try again</button>"
            + (errs.length ? "<br><small style=\"font-weight:400;opacity:.7\">" + errs.slice(0, 2).join(" · ").replace(/</g, "&lt;") + "</small>" : "");
          if (document.getElementById("root").children.length) boot.classList.add("gone"); // the page did load: just uncover it
        }, 12000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

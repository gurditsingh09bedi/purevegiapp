<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#023E32" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Pure Vegi · Order online · Handsworth, Birmingham</title>
    <meta name="description" content="Order vegetarian and vegan burgers, wraps, noodles and stir fry from Pure Vegi, 324 Soho Rd, Handsworth. Delivery, collection and table booking." />
    <link rel="icon" href="/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Shown while the site loads (refresh, first visit); the app fades it out once the menu is ready. -->
    <div id="boot-loader" class="pv-loader-screen" role="status" aria-live="polite">
      <div class="pv-spinner">
        <img src="/boy-photo.png" alt="" onerror="this.onerror=null;this.src='/loading-boy.svg'" />
      </div>
      <p>Getting something tasty ready…</p>
    </div>
    <style>
      .pv-loader-screen { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: #f6f1e4; font: 700 16px "Nunito Sans", system-ui, sans-serif; color: #3f5147; transition: opacity .45s; }
      .pv-loader-screen.gone { opacity: 0; pointer-events: none; }
      .pv-spinner { position: relative; width: 132px; height: 132px; border-radius: 50%; }
      .pv-spinner::before { content: ""; position: absolute; inset: -7px; border-radius: 50%;
        background: conic-gradient(from 0deg, #f2a65a 0 28%, rgba(2, 62, 50, .12) 28% 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
                mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px));
        animation: pv-spin 1s linear infinite; }
      .pv-spinner img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fffdf7; box-shadow: 0 8px 24px rgba(2, 62, 50, .18); }
      @keyframes pv-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .pv-spinner::before { animation-duration: 3s; } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
